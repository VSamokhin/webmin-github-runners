name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collector tests
        run: python -m unittest discover -s tests -v
      - name: Webmin module tests
        run: tests/test_module.sh
      - name: Build module
        run: ./build.sh
      - name: Build collector image
        run: docker build -t ghrunners-collector:test collector && docker run --rm ghrunners-collector:test --version
      - uses: actions/upload-artifact@v7
        with:
          name: ghrunners.wbm.gz
          path: dist/ghrunners.wbm.gz
          retention-days: 7
