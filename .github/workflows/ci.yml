name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Collector tests
        run: python -m unittest discover -s tests -v
      - name: Webmin module tests
        run: tests/test_module.sh
      - name: Build module
        run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghrunners.wbm.gz
          path: dist/ghrunners.wbm.gz
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python (ruff)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      - name: Perl (perlcritic, settings in .perlcriticrc)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libperl-critic-perl
          perlcritic webmin/ghrunners/*.cgi webmin/ghrunners/*.pl
      - name: Shell scripts (shellcheck)
        run: shellcheck build.sh tests/*.sh
      - name: Workflows (actionlint, runs shellcheck on run steps)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build collector image
        run: docker build -t ghrunners-collector:test collector && docker run --rm ghrunners-collector:test --version
      - name: Scan collector image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghrunners-collector:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
