# Builds a release when you publish the draft that Release Drafter keeps
# (release-drafter.yml). The version is the release tag (vX.Y.Z): it is stamped
# into module.info and the collector, the module is attached to the release as
# ghrunners.wbm.gz and the collector image is pushed to GHCR. "Run workflow"
# rebuilds the latest release, or a tag you name.
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild (empty = latest release)
        required: false
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag=${RELEASE_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || { echo "::error::release tag '$tag' is not vX.Y.Z"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.v.outputs.tag }}
          persist-credentials: false
      - name: Stamp the version
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s/^version=.*/version=$V/" webmin/ghrunners/module.info
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" collector/ghrunners_collector.py
      - name: Test
        run: python3 -m unittest discover -s tests && tests/test_module.sh
      - name: Build module
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) ./build.sh
      - name: Build the collector image for the scan
        run: docker build -t ghrunners-collector:scan collector
      - name: Scan the collector image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghrunners-collector:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attach the module to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release upload "$TAG" dist/ghrunners.wbm.gz --clobber --repo "$GITHUB_REPOSITORY"
      - name: Collector image
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghrunners-collector
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$img:$V" -t "$img:${V%.*}" -t "$img:latest" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" collector
