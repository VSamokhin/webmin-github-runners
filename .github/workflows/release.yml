name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match the tag
        run: |
          tag=${GITHUB_REF_NAME#v}
          grep -qx "version=$tag" webmin/ghrunners/module.info || { echo "module.info version != $tag"; exit 1; }
          grep -q "^__version__ = \"$tag\"" collector/ghrunners_collector.py || { echo "collector version != $tag"; exit 1; }
      - name: Test
        run: python3 -m unittest discover -s tests && tests/test_module.sh
      - name: Build module
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) ./build.sh
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ghrunners.wbm.gz --title "$GITHUB_REF_NAME" --generate-notes
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Collector image
        run: |
          v=${GITHUB_REF_NAME#v}
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghrunners-collector
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$img:$v" -t "$img:${v%.*}" -t "$img:latest" \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} collector
